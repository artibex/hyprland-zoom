# hyprland-zoom system defaults, installed as /etc/zoomctl.conf.
# Generated by `zoomctl config --template` from settings.schema; do not edit.
#
# Every setting is commented out and shows its built-in default. Uncomment a
# line to change it for all users. Personal overrides belong in
# ~/.config/zoomctl/zoom.conf, best written with `zoomctl set KEY VALUE` or
# the settings window (`zoomctl ui`).
# Effective value: built-in default <- this file <- the user file.

# ---- Zoom ----

# Zoom step
# How much one scroll notch or key press zooms. In multiply mode 0.10 means
# 10 % of the current zoom.
# Accepts: a number from 0.01 to 2.00
#ZOOM_STEP=0.10

# Step mode
# multiply: even steps at every zoom level (recommended). add: always the
# same fixed amount.
# Accepts: one of: multiply, add
#ZOOM_STEP_MODE=multiply

# Minimum zoom
# Zooming out stops here. 1.00 is the normal, unzoomed screen.
# Accepts: a number from 1.00 to 10.00
#ZOOM_MIN=1.00

# Maximum zoom
# Zooming in stops here. Hyprland supports up to 10x.
# Accepts: a number from 1.00 to 10.00
#ZOOM_MAX=10.00

# Reset zoom
# Zoom level used by reset and as the "off" side of the toggle.
# Accepts: a number from 1.00 to 10.00
#ZOOM_RESET=1.00

# Animation duration
# Duration of the zoom animation in tenths of a second. Smaller is faster;
# 0.10 is practically instant.
# Accepts: a number from 0.10 to 20.00
#ZOOM_ANIMATION_SPEED=1.50

# Smooth images
# Smooth the magnified image. Turn off for crisp, pixel-exact magnification.
# Accepts: on or off
#ZOOM_SMOOTH_IMAGES=on

# ---- Advanced ----

# Keep zoom on config reload
# Restore the zoom level and filter after Hyprland reloads its
# configuration.
# Accepts: on or off
#ZOOM_RESTORE_ON_RELOAD=on

# Scroll event delay
# Hyprland ignores further scroll notches for this long and passes them to
# the window instead. 0 lets fast scrolling zoom smoothly.
# Accepts: a number from 0 to 300
#SCROLL_EVENT_DELAY_MS=0

# ---- Pointer tracking ----

# Pointer tracking
# centered: the pointer stays in the middle of the zoomed view. edge: the
# view moves when the pointer reaches the edge. margin: like edge with an
# adjustable margin (needs the hyprzoom plugin). follow: the view slides
# proportionally with the pointer.
# Accepts: one of: centered, edge, margin, follow
#ZOOM_TRACKING=centered

# Edge margin
# Width of the protective margin per side as a fraction of the zoomed view.
# Used by the margin mode.
# Accepts: a number from 0.00 to 0.45
#ZOOM_EDGE_MARGIN=0.15

# ---- Color filter ----

# Color filter
# Which filter the filter shortcut switches on. smart-invert turns bright
# screens dark but keeps colors recognizable.
# Accepts: one of: invert, smart-invert, grayscale, grayscale-invert,
# high-contrast, protanopia, deuteranopia, tritanopia
#FILTER=smart-invert

# Filter active
# Whether the color filter is currently switched on.
# Accepts: on or off
#FILTER_ACTIVE=off

# Only while zoomed
# Apply the color filter only while the screen is zoomed in.
# Accepts: on or off
#FILTER_ONLY_WHEN_ZOOMED=off

# Filter strength
# Blend between the original image (0.00) and the full filter (1.00).
# Accepts: a number from 0.00 to 1.00
#FILTER_INTENSITY=1.00

# Contrast
# 1.00 keeps the contrast; higher values separate light and dark more
# strongly.
# Accepts: a number from 0.50 to 3.00
#FILTER_CONTRAST=1.00

# Brightness
# Shifts the overall brightness after the filter.
# Accepts: a number from -0.50 to 0.50
#FILTER_BRIGHTNESS=0.00

# Saturation
# 0.00 removes color, 1.00 keeps it, 2.00 doubles it.
# Accepts: a number from 0.00 to 2.00
#FILTER_SATURATION=1.00

# ---- Shortcuts ----

# Modifier keys
# Modifier keys held for every zoom shortcut, joined with " + ".
# Accepts: modifiers joined with " + " from: SUPER, CTRL, ALT, SHIFT
#BIND_MODIFIERS=SUPER + ALT

# Zoom with the scroll wheel
# Modifiers + scroll wheel zooms in and out.
# Accepts: on or off
#BIND_SCROLL=on

# Scroll direction
# down-in: scrolling down (towards you) zooms in, as in version 0.1. up-in:
# scrolling up (away from you) zooms in.
# Accepts: one of: down-in, up-in
#BIND_SCROLL_DIRECTION=down-in

# Toggle with middle click
# Modifiers + middle mouse button toggles the zoom.
# Accepts: on or off
#BIND_MOUSE_TOGGLE=on

# Zoom in key
# Key that zooms in (held down it repeats). Empty disables it.
# Accepts: a Hyprland key name such as I, F5 or mouse:274; empty disables
# the bind
#BIND_KEY_IN=I

# Zoom out key
# Key that zooms out (held down it repeats). Empty disables it.
# Accepts: a Hyprland key name such as I, F5 or mouse:274; empty disables
# the bind
#BIND_KEY_OUT=O

# Toggle zoom key
# Switches between the reset zoom and the last zoom level.
# Accepts: a Hyprland key name such as I, F5 or mouse:274; empty disables
# the bind
#BIND_KEY_TOGGLE=0

# Toggle filter key
# Switches the color filter on and off.
# Accepts: a Hyprland key name such as I, F5 or mouse:274; empty disables
# the bind
#BIND_KEY_FILTER=C

# Open settings key
# Opens the hyprland-zoom settings window.
# Accepts: a Hyprland key name such as I, F5 or mouse:274; empty disables
# the bind
#BIND_KEY_SETTINGS=Z

# Take over Omarchy zoom keys
# Routes Omarchy's own zoom keys to hyprland-zoom and frees modifiers +
# scroll from Omarchy's group cycling.
# Accepts: on or off
#BIND_TAKEOVER_OMARCHY=on

