# hyprland-zoom default settings
# Copy this file to ~/.config/zoomctl/zoom.conf for per-user overrides.

ZOOM_STEP=0.10
ZOOM_MIN=1.00
ZOOM_MAX=10.00
ZOOM_RESET=1.00

# Set to 1 if you want zoomctl to recentre the cursor after each zoom action.
ZOOM_CENTER_CURSOR=0

# The default state directory uses XDG_RUNTIME_DIR and is safe for session-local state.
# Override only if you have a specific storage policy.
# ZOOMCTL_STATE_DIR=