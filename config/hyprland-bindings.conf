# hyprland-zoom example bindings
# Source this file from your hyprland.conf or copy the lines into your own binds.

bind = SUPER ALT, mouse_down, exec, zoomctl in
bind = SUPER ALT, mouse_up, exec, zoomctl out
bind = SUPER ALT, mouse:274, exec, zoomctl toggle

binde = SUPER ALT, K, exec, zoomctl in
binde = SUPER ALT, J, exec, zoomctl out
bind = SUPER ALT, L, exec, zoomctl toggle

# Optional hard reset if you want a separate key for clearing the saved zoom.
# bind = SUPER ALT, R, exec, zoomctl reset

# Interactive menu with settings and uninstall actions.
# bind = SUPER ALT, U, exec, zoomctl ui