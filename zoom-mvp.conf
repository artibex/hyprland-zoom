# -----------------------------------------------------
# ZOOM CONFIG (Toggle-Logik)
# -----------------------------------------------------

# --- Maus Steuerung ---
# Reinzoomen (Scroll hoch)
bind = SUPER ALT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep fl>

# Rauszoomen (Scroll runter - stoppt bei 1.0)
bind = SUPER ALT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep floa>

# TOGGLE RESET (Mausrad Klick)
# Wenn Zoom > 1: Speichert Wert und setzt auf 1. Wenn Zoom = 1: Stellt alten Wert wieder her.
bind = SUPER ALT, mouse:274, exec, hyprctl getoption cursor:zoom_factor | grep float | awk '{if($2 > 1.0) system("echo >


# --- Tastatur Steuerung (J/K/L) ---
# K = Reinzoomen
binde = SUPER ALT, K, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | aw>

# J = Rauszoomen
binde = SUPER ALT, J, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor | grep float | aw>

# L = TOGGLE RESET (Gleiche Logik wie Mausrad)
bind = SUPER ALT, L, exec, hyprctl getoption cursor:zoom_factor | grep float | awk '{if($2 > 1.0) system("echo "$2" > />